<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href=.src/index.css">
     <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>
      Gurgaon RealEstate | Properties, Flats & Farm Land in Gurgaon
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Find verified properties in Gurgaon including flats, apartments, farm lands, villas and residential properties. Explore premium real estate opportunities with trusted Gurgaon property experts."
    />

    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://yourdomain.com/"
    />

    <!-- Local SEO -->
    <meta name="geo.region" content="IN-HR" />
    <meta name="geo.placename" content="Gurgaon, Haryana" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Gurgaon RealEstate | Properties in Gurgaon"
    />

    <meta
      property="og:description"
      content="Explore verified flats, apartments, farm lands, villas and residential properties in Gurgaon with trusted local real estate experts."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <meta
      property="og:site_name"
      content="Gurgaon RealEstate"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Gurgaon RealEstate | Properties in Gurgaon"
    />

    <meta
      name="twitter:description"
      content="Find verified properties, flats, apartments, farm lands and residential properties in Gurgaon."
    />

    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0F172A"
    />

    <link rel="icon" href="./public/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
